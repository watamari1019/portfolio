<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>チョコバナー - ポートフォリオ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/yakuhanjp@3.4.1/dist/css/yakuhanjp-narrow.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@100..900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="css/ress.css" media="all" rel="stylesheet" type="text/css" />
  <link href="css/style.css" media="all" rel="stylesheet" type="text/css" />
  <style>
    /* 詳細ページのスタイル */
    .article {
      padding: 80px 0 120px;
    }

    .article-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px;
    }

    .article-title {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin: 0 0 40px;
      color: #333;
      text-align: center;
    }

    .article-body {
      line-height: 1.9;
    }

    .article-image {
      margin: 0 0 60px;
      text-align: center;
    }

    .article-image img {
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .article-lead {
      font-size: 18px;
      line-height: 1.8;
      color: #666;
      margin-bottom: 60px;
      text-align: center;
    }

    .article-body h3 {
      font-size: 22px;
      font-weight: 600;
      margin: 50px 0 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
      color: #333;
    }

    .article-body h3:first-of-type {
      margin-top: 0;
    }

    .article-body p {
      font-size: 16px;
      line-height: 1.9;
      color: #555;
      margin-bottom: 24px;
    }

    .home-link {
      text-align: center;
      margin-top: 80px;
    }

    .home-link a {
      display: inline-block;
      padding: 16px 40px;
      background: #f8f9fa;
      color: #333;
      text-decoration: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      transition: all 0.3s;
      border: 1px solid #e0e0e0;
    }

    .home-link a:hover {
      background: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    /* スマホ対応 */
    @media screen and (max-width: 767px) {
      .article {
        padding: 60px 0 80px;
      }

      .article-container {
        padding: 0 20px;
      }

      .article-title {
        font-size: 28px;
        margin-bottom: 30px;
      }

      .article-image {
        margin-bottom: 40px;
      }

      .article-lead {
        font-size: 16px;
        margin-bottom: 40px;
      }

      .article-body h3 {
        font-size: 20px;
        margin: 40px 0 16px;
      }

      .article-body p {
        font-size: 15px;
      }

      .home-link {
        margin-top: 60px;
      }

      .home-link a {
        padding: 14px 32px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <!-- header -->
    <header class="header">
      <div class="container">
        <nav class="gnav pc-only">
          <ul class="gnav-list">
            <li class="gnav-item"><a href="index.html#works">デザインしたもの</a></li>
            <li class="gnav-item"><a href="index.html#about">わたしのこと</a></li>
            <li class="gnav-item"><a href="index.html#contact">お問い合わせ</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!-- /header -->

    <main class="content">

      <!-- カスタムカーソル -->
      <div id="cursor" class="cursor"></div>

      <!-- 詳細ページコンテンツ -->
      <article class="article">
        <div class="article-container">
          
          <h2 class="article-title">チョコバナー</h2>
          
          <div class="article-body">
            <p class="article-image">
              <img src="img/works-detail/works-5.png" alt="チョコバナー">
            </p>
            
            <p class="article-lead">
              チョコレート店のバナーになります。
            </p>

            <h3>担当</h3>
            <p>デザイン</p>

            <h3>サイトの目的</h3>
            <p>お問い合わせ数の増加</p>

            <h3>使用技術</h3>
            <p>Adobe Photoshop</p>

            <h3>デザインについて</h3>
            <p>
              大切な方へのギフト目的の方でも購入できるよう、高級感のあるデザインにいたしました。
            </p>
          </div>
          
          <div class="home-link">
            <a href="index.html#works">← Works一覧へ戻る</a>
          </div>
        </div>
      </article>

    </main>

    <!-- footer -->
    <footer class="footer">
      <div class="container">
        <nav class="footer-nav">
          <a href="index.html#works">デザインしたもの</a>
          <span>/</span>
          <a href="index.html#about">わたしのこと</a>
          <span>/</span>
          <a href="index.html#contact">お問い合わせ</a>
        </nav>
        <div class="copyright">&copy; 2026 MARII WATANABE</div>
      </div>
    </footer>
    <!-- /footer -->

  </div>
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script type='text/javascript' src="js/script.js"></script>

  <script>
    // カスタムカーソル（900px以上）
    if (window.innerWidth >= 900) {
      const cursor = document.querySelector('.cursor');

      if (cursor) {
        document.addEventListener('mousemove', (e) => {
          cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        });

        const hoverElements = document.querySelectorAll('a, button');

        hoverElements.forEach(el => {
          el.addEventListener('mouseenter', () => {
            cursor.classList.add('hover');
          });
          
          el.addEventListener('mouseleave', () => {
            cursor.classList.remove('hover');
          });
        });
      }
    }
  </script>

</body>
</html>
